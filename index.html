<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft Browser</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="crosshair">+</div>
<div id="hotbar"></div>
<div id="info"></div>
<div id="overlay">
  <div class="panel">
    <h1>Minecraft Browser</h1>
    <p id="status">Generating world…</p>
    <p class="big">Click to play</p>
    <ul>
      <li><b>Mouse</b> look around</li>
      <li><b>W A S D</b> move &nbsp; <b>Space</b> jump / swim &nbsp; <b>Shift</b> sprint</li>
      <li><b>Left click</b> break block &nbsp; <b>Right click</b> place block</li>
      <li><b>1–9</b> or <b>scroll wheel</b> select block</li>
      <li><b>Esc</b> release mouse</li>
    </ul>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
